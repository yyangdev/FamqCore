[tool.ruff]
# Исходный код бота лежит в src/app.
src = ["src/app"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Прагматичный набор правил: ошибки/стиль (E, W), pyflakes (F),
# сортировка импортов (I), апгрейд синтаксиса (UP), баг-байты (B),
# генераторы/списки (C4).
#
# Правила, отражающие поведенческие проблемы (например DTZ — naive datetime,
# SIM117 — вложенные with, BLE001 — «голый» except), сознательно не включены
# здесь: они отслеживаются отдельными issue и будут включаться по мере их
# исправления, чтобы CI не «краснел» на уже известных задачах.
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # длину строк контролирует форматтер, а не линтер
]

[tool.ruff.lint.isort]
# Объединять `from x import a as b, c as d` в один блок вместо множества строк.
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
